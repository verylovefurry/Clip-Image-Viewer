[package]
name = "clipview-ui"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clipview-core = { path = "../core" }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde_json = "1"
serde = "1"
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlImageElement", "HtmlVideoElement", "HtmlMediaElement", "HtmlInputElement", "HtmlSelectElement", "HtmlDialogElement", "HtmlCanvasElement", "CanvasRenderingContext2d", "DomRect", "DomTokenList", "CssStyleDeclaration", "Node", "NodeList", "Event", "EventTarget", "MouseEvent", "WheelEvent", "KeyboardEvent", "Storage", "TextTrack", "TextTrackList", "TextTrackMode", "HtmlTrackElement", "Blob", "BlobPropertyBag", "Url", "console"] }
